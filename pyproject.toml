[project]
name = "edgehog"
version = "0.2.0"
description = "Infering ancestral synteny with hierarchical orthologous groups"
authors = [
   {name="Charles Bernard", email="charles.bernard@unil.ch"},
   {name="Adrian Altenhoff", email="adrian.altenhoff@inf.ethz.ch"},
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
keywords = ["bioinformatics", "synteny", "ancestral gene order"]
classifiers = [
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9,<3.15"
dependencies = [
  "numpy>=1.23.0,<3",
  "numpy>=2 ; python_version >= '3.13'",
  "pandas>1.3.0,<3",
  "networkx>=2.8,<4",
  "pyham>=2.0.0,<3",
  "ete4>=4.3,<5",
]

[project.optional-dependencies]
# pyoma requires numpy<2, which has no wheels for Python >= 3.13
oma = [
   "pyoma>=0.13.3,<1 ; python_version < '3.13'",
   "tables (<=3.10.0) ; python_version < '3.11'",
   "tables (>=3.10) ; python_version >= '3.11' and python_version < '3.13'",
]

[project.urls]
Repository = "https://github.com/DessimozLab/edgehog"
Changelog = "https://github.com/DessimozLab/edgehog/blob/main/CHANGELOG.md"

[project.scripts]
edgehog = 'edgehog.edgehog:main'

[dependency-groups]
dev = [
  "pytest>=7.3.0,<9",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
