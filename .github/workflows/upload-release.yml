# This workflow will build and upload the edgehog package to PyPI when a version tag is pushed.
# Uploads use PyPI trusted publishing (OIDC), see https://docs.pypi.org/trusted-publishers/

name: Upload edgehog to pypi

on:
  push:
    tags:
      - v*

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/edgehog
    permissions:
      id-token: write  # required for trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Build package
      run: uv build
    - name: Publish package
      run: uv publish --trusted-publishing always
